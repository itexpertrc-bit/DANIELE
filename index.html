<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HR Management - Portale Dipendenti</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/gotham-rounded');

          :root {
              --unieuro-blue-dark: #002b66;
              --unieuro-blue: #0047bb;
              --unieuro-orange: #ff6600;
              --unieuro-orange-hover: #e55c00;
              --bg-light: #f4f6f9;
              --card-bg: #ffffff;
              --text: #111111;
              --border: #dddddd;
              --success: #28a745;
          }

          * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Gotham Rounded Bold', 'Gotham Rounded', 'Segoe UI', Arial, sans-serif;
          }

          body {
              background: linear-gradient(135deg, #002b66 0%, #0047bb 50%, #ff6600 100%);
              background-attachment: fixed;
              color: var(--text);
              display: flex;
              flex-direction: column;
              min-height: 100vh;
         }

         header {
             background-color: var(--unieuro-blue-dark);
             padding: 22px 20px;
             display: flex;
             justify-content: center;
             align-items: center;
             box-shadow: 0 4px 15px rgba(0,0,0,0.4);
             border-bottom: 5px solid var(--unieuro-orange);
             width: 100%;
         }

         header .title-card {
             background-color: var(--unieuro-orange);
             padding: 12px 28px;
             border-radius: 14px;
             border: 2px solid #000000;
             box-shadow: 0 4px 10px rgba(0,0,0,0.3);
             text-align: center;
         }

         header h1 {
             font-size: 1.6rem;
             font-weight: 900;
             color: #ffffff;
             letter-spacing: 0.5px;
             text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
         }

         .container {
             max-width: 800px;
             margin: 40px auto;
             padding: 0 20px;
             width: 100%;
             flex: 1;
         }

         .card {
             background: var(--card-bg);
             border-radius: 14px;
             padding: 30px;
             box-shadow: 0 6px 20px rgba(0,0,0,0.2);
             border-top: 5px solid var(--unieuro-orange);
         }

         .card h2 {
             margin-bottom: 20px;
             color: var(--unieuro-blue-dark);
             border-bottom: 2px solid var(--bg-light);
             padding-bottom: 10px;
             font-weight: 900;
             font-size: 1.3rem;
         }

         .form-group {
             margin-bottom: 18px;
         }

         .form-group label {
             display: block;
             margin-bottom: 6px;
             font-weight: 800;
             color: #222;
             font-size: 0.95rem;
         }

         .form-group input, .form-group select, .form-group textarea {
             width: 100%;
             padding: 12px;
             border: 2px solid var(--border);
             border-radius: 8px;
             font-size: 1rem;
             font-weight: 700;
             transition: border-color 0.2s;
             background-color: #fff;
         }

         .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
             outline: none;
             border-color: var(--unieuro-orange);
         }

         .form-row {
             display: flex;
             gap: 15px;
         }

         .form-row .form-group {
             flex: 1;
         }

         .btn {
             background-color: var(--unieuro-orange);
             color: #ffffff;
             border: 2px solid #000;
             padding: 14px 24px;
             border-radius: 12px;
             cursor: pointer;
             font-size: 1.05rem;
             font-weight: 900;
             width: 100%;
             transition: all 0.2s;
             box-shadow: 0 3px 6px rgba(0,0,0,0.2);
         }
         .btn:hover {
             background-color: var(--unieuro-orange-hover);
             transform: translateY(-1px);
         }

        @media (max-width: 768px) {
             .form-row { flex-direction: column; gap: 0; }
             .container { margin: 20px auto; padding: 0 12px; }
             .card { padding: 20px; }
             header h1 { font-size: 1.3rem; }
        }
    
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .msg { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-weight: 800; border: 2px solid; }
        .msg.ok  { display: block; background: #e8f7ec; color: #14692b; border-color: #28a745; }
        .msg.err { display: block; background: #fdeaec; color: #9b1c2a; border-color: #dc3545; }
        .msg.info{ display: block; background: #eaf1ff; color: #002b66; border-color: #0047bb; }
        .logo { display: block; height: 76px; width: 76px; object-fit: cover; background: #000; border-radius: 16px; border: 2px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        header { flex-wrap: wrap; gap: 18px; }
        header .header-left { justify-self: start; display: flex; align-items: center; }
        @media (max-width: 768px) {
            .logo { height: 64px; width: 64px; }
            header .header-left { display: flex !important; justify-content: center; justify-self: center; }
        }

        /* ===== Adattamento a tutti gli schermi ===== */
        html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
        body { overflow-x: hidden; padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }
        body.has-install { padding-bottom: 96px; }
        header { padding-top: calc(18px + env(safe-area-inset-top)); }
        img { max-width: 100%; }
        .card, .container { min-width: 0; }
        header .title-card { padding: 10px clamp(14px, 4vw, 28px); }
        header h1 { font-size: clamp(1.1rem, 4.2vw, 1.6rem); }
        @media (pointer: coarse) {
            .btn, .nav-home-btn { min-height: 44px; }
            .toolbar input[type=checkbox], .archive-item input[type=checkbox], .col-sel input[type=checkbox] { width: 22px; height: 22px; }
        }
        @media (max-width: 480px) {
            .card { padding: 16px; }
            .card h2 { font-size: 1.15rem; }
            .logo { height: 56px; width: 56px; }
        }
        /* ===== Avviso "Installa l'app" ===== */
        .install-bar { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 1000;
            display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #002b66; color: #fff;
            border: 2px solid #ff6600; border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,0.45); max-width: 560px; margin: 0 auto; }
        .install-bar[hidden] { display: none !important; }
        .install-bar .install-text { flex: 1; font-weight: 800; font-size: 0.95rem; line-height: 1.3; }
        .install-bar .btn { width: auto; padding: 8px 16px; font-size: 0.95rem; }
        .install-bar .install-close { background: transparent; border: 0; color: #fff; font-size: 1.3rem; cursor: pointer; padding: 6px 8px; line-height: 1; }
        @media print { .install-bar { display: none !important; } }

        @media (min-width: 1200px) { .container { max-width: 880px; } .card { padding: 36px; } }
            /* ===== Novità: elementi comuni ===== */
        :root { --warning: #ffc107; --danger: #dc3545; }
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 0.85rem; font-weight: 900; color: #fff; display: inline-block; }
        .badge-pending { background-color: var(--warning); color: #111; }
        .badge-approved { background-color: var(--success); }
        .badge-rejected { background-color: var(--danger); }
        .btn-success { background-color: var(--success); }
        .btn-success:hover { background-color: #218838; }
        .btn-danger { background-color: var(--danger); }
        .btn-danger:hover { background-color: #c82333; }
        .btn-del { background-color: #6c757d; }
        .btn-del:hover { background-color: #565e64; }
        .btn-tool { background-color: #0047bb; }
        .btn-tool:hover { background-color: #002b66; }
        .btn-small { width: auto; padding: 8px 14px; font-size: 0.9rem; }
        .form-group textarea { width: 100%; padding: 12px; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: 700; background: #fff; resize: vertical; font-family: inherit; }
        .empty { text-align: center; color: #666; padding: 8px; font-weight: 700; }
        .muted { color: #888; font-weight: 700; }
        .tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
        .tab { flex: 1 1 auto; background: #fff; color: var(--unieuro-blue-dark); border: 2px solid #000; border-radius: 12px; padding: 12px 16px;
               font-weight: 900; font-size: 1rem; cursor: pointer; box-shadow: 0 3px 6px rgba(0,0,0,0.2); position: relative; font-family: inherit; }
        .tab:hover { transform: translateY(-1px); }
        .tab.active { background: var(--unieuro-orange); color: #fff; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }
        .dot { background: #dc3545; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 0.78rem; margin-left: 6px; display: inline-block; }
        .dot[hidden] { display: none; }
        .toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(24px + env(safe-area-inset-bottom)); background: #111; color: #fff;
                 padding: 12px 18px; border-radius: 12px; font-weight: 800; z-index: 2000; max-width: 92vw; border: 2px solid var(--unieuro-orange);
                 box-shadow: 0 6px 20px rgba(0,0,0,0.45); text-align: center; }
        .toast[hidden] { display: none; }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 1500; }
        .modal[hidden] { display: none; }
        .modal-box { background: #fff; border-radius: 14px; border-top: 5px solid var(--unieuro-orange); padding: 22px; width: 100%; max-width: 480px; max-height: 92vh; overflow: auto; }
        .modal-box h3 { color: var(--unieuro-blue-dark); margin-bottom: 12px; font-size: 1.2rem; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
        .modal-actions .btn { width: auto; }
        .ov-list { padding-left: 20px; font-weight: 700; }
        .ov-list li { margin: 4px 0; }
        .remember { display: flex; align-items: center; gap: 8px; margin: 4px 0 16px; font-weight: 800; cursor: pointer; }
        .remember input { width: 20px; height: 20px; accent-color: #0047bb; flex: none; }
        @media print { .toast, .modal, .tabs { display: none !important; } }
        /* ===== Portale dipendenti ===== */
        .userbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 10px 14px;
                   margin-bottom: 14px; border: 2px solid #000; font-weight: 800; box-shadow: 0 3px 8px rgba(0,0,0,0.25); }
        .hint { margin-top: 14px; color: #555; font-size: 0.85rem; font-weight: 700; text-align: center; }
        .banner { background: #fff8e1; border: 2px solid #ffc107; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; font-weight: 800;
                  display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
        .banner[hidden] { display: none; }
        .banner .btn { width: auto; }
        .char-count { text-align: right; font-size: 0.8rem; color: #666; margin-top: 4px; font-weight: 700; }
        .req { border: 2px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .req-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 1.05rem; }
        .req-meta { color: #444; font-weight: 700; font-size: 0.9rem; }
        .req-note { margin-top: 6px; font-style: italic; color: #555; }
        .req-reason { margin-top: 8px; background: #fdeaec; border: 2px solid #dc3545; color: #9b1c2a; border-radius: 8px; padding: 8px 10px; font-weight: 800; }
        .req-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .req-actions .btn { width: auto; padding: 8px 14px; font-size: 0.9rem; }
        .edit-form { margin-top: 12px; border-top: 2px dashed var(--border); padding-top: 12px; }
        .edit-form .form-group { margin-bottom: 12px; }
            /* ===== Orario ===== */
        body.sch-wide .container { max-width: 1500px !important; }
        .seg { display: flex; gap: 10px; }
        .seg label { flex: 1; margin: 0; cursor: pointer; }
        .seg input { position: absolute; opacity: 0; pointer-events: none; }
        .seg span { display: block; text-align: center; padding: 12px 8px; border: 2px solid var(--border); border-radius: 8px; background: #fff; font-weight: 900; font-size: 1rem; color: var(--unieuro-blue-dark); }
        .seg input:checked + span { background: var(--unieuro-orange); border-color: #000; color: #fff; box-shadow: 0 3px 6px rgba(0,0,0,0.2); }
        .seg input:focus-visible + span { outline: 3px solid var(--unieuro-blue); outline-offset: 2px; }
        .type-hint { margin-top: 6px; font-size: 0.85rem; font-weight: 700; color: #555; }
        label .opt { font-weight: 600; color: #777; font-size: 0.85em; }
        .form-row .form-group[hidden], .form-group[hidden] { display: none !important; }
        .sch-top { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
        .sch-top select { width: auto; flex: 1 1 220px; margin: 0; }
        .sch-img-box { border: 3px solid #000; border-radius: 10px; overflow: hidden; background: #fff; cursor: zoom-in; }
        .sch-img-box img { display: block; width: 100%; height: auto; }
        .sch-img-box.big { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .sch-img-box.big img { width: 1150px; max-width: none; }
        #panel-schedule { padding-left: 12px; padding-right: 12px; }
        .sch-viewer { position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 2000; display: flex; flex-direction: column; }
        .sch-viewer[hidden] { display: none; }
        .sch-vbar { display: flex; gap: 8px; padding: 10px; justify-content: center; flex-wrap: wrap; background: #002b66; }
        .sch-vbar .btn { width: auto; padding: 8px 14px; margin: 0; }
        .sch-vscroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; text-align: left; }
        .sch-vscroll img { display: block; max-width: none; margin: 0 auto; }
    </style>

    <div class="container">

        <!-- ACCESSO CON PIN -->
        <div class="card" id="loginView">
            <h2>Accedi al portale</h2>
            <form id="loginForm" autocomplete="on">
                <div class="form-group">
                    <label for="loginName">Nome e Cognome Dipendente</label>
                    <select id="loginName" required>
                        <option value="" disabled selected>Caricamento elenco...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="loginPin">PIN personale</label>
                    <input type="password" id="loginPin" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="Il tuo PIN" required>
                </div>
                <label class="remember"><input type="checkbox" id="remember" checked> Ricordami su questo dispositivo</label>
                <button type="submit" class="btn" id="loginBtn">Accedi</button>
                <button type="button" class="btn btn-small btn-del" id="retryLoad" hidden style="margin-top:10px;">Riprova a caricare l'elenco</button>
                <div id="loginMsg" class="msg" role="status"></div>
                <p class="hint">Non conosci il tuo PIN? Chiedilo all'amministratore.</p>
            </form>
        </div>

        <!-- AREA DIPENDENTE -->
        <div id="appView" style="display:none;">
            <div class="userbar">
                <div>Ciao, <b id="userName"></b></div>
                <button type="button" class="btn btn-small btn-del" id="logoutBtn">Esci</button>
            </div>

            <div class="banner" id="updatesBanner" hidden>
                <span id="updatesText"></span>
                <button type="button" class="btn btn-small" id="updatesBtn">Vedi</button>
            </div>

            <div class="tabs" role="tablist">
                <button type="button" class="tab active" data-tab="new">Nuova richiesta</button>
                <button type="button" class="tab" data-tab="mine">Le mie richieste <span class="dot" id="mineBadge" hidden>0</span></button>
                <button type="button" class="tab" data-tab="schedule">Orario <span class="dot" id="schBadge" hidden></span></button>
            </div>

            <!-- NUOVA RICHIESTA -->
            <div class="card tab-panel active" id="panel-new">
                <h2>Nuova Richiesta</h2>

                <iframe name="hidden_iframe" style="display:none;" title="invio"></iframe>

                <form id="requestForm" method="POST" accept-charset="UTF-8" target="hidden_iframe" novalidate>
                    <input type="hidden" name="id" id="reqId">
                    <input type="hidden" name="name" id="reqName">
                    <input type="hidden" name="pin" id="reqPin">

                    <div class="form-group">
                        <label for="reqType">Cosa vuoi richiedere?</label>
                        <select name="type" id="reqType" required>
                            <option value="Giorno Libero">Giorno Libero</option>
                            <option value="Permesso">Mezza Giornata Libera</option>
                            <option value="Ferie">Ferie</option>
                            <option value="Malattia">Malattia</option>
                        </select>
                        <div class="type-hint"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate" class="start-lbl">Giorno</label>
                            <input type="date" name="startDate" id="startDate">
                        </div>
                        <div class="form-group end-group">
                            <label for="endDate">Ultimo giorno</label>
                            <input type="date" name="endDate" id="endDate">
                        </div>
                    </div>
                    <div class="form-group slot-group">
                        <label>Quale mezza giornata?</label>
                        <div class="seg">
                            <label><input type="radio" name="slot" value="Mattina"><span>Mattina</span></label>
                            <label><input type="radio" name="slot" value="Pomeriggio"><span>Pomeriggio</span></label>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="notes">Note <span class="opt">(facoltative)</span></label>
                        <textarea name="notes" id="notes" rows="3" maxlength="300" placeholder="Puoi lasciare vuoto"></textarea>
                        <div class="char-count"><span id="notesCount">0</span>/300</div>
                    </div>
                    <button type="submit" class="btn" id="submitBtn">Invia Richiesta</button>
                    <div id="msg" class="msg" role="status"></div>
                </form>
            </div>

            <!-- LE MIE RICHIESTE -->
            <div class="card tab-panel" id="panel-mine">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
                    <h2 style="margin:0; border:0; padding:0;">Le mie richieste</h2>
                    <button type="button" class="btn btn-small btn-tool" id="refreshMine">Aggiorna</button>
                </div>
                <div id="mineMsg" class="msg" role="status" style="margin:0 0 14px;"></div>
                <div id="mineList"></div>
            </div>

            <!-- ORARIO -->
            <div class="card tab-panel" id="panel-schedule">
                <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;">
                    <h2 style="margin:0; border:0; padding:0;">Orario di lavoro</h2>
                    <button type="button" class="btn btn-small btn-tool" id="refreshSch">Aggiorna</button>
                </div>
                <div class="sch-top" id="schTop" hidden>
                    <select id="schWeek" aria-label="Settimana"></select>
                    <button type="button" class="btn btn-small btn-tool" id="schZoom">Schermo intero</button>
                    <button type="button" class="btn btn-small btn-tool" id="schSize">Vista grande</button>
                    <button type="button" class="btn btn-small btn-del" id="schDl">Scarica immagine</button>
                    <button type="button" class="btn btn-small btn-del" id="schPdf">Scarica PDF</button>
                </div>
                <div id="schMsg" class="msg" role="status" style="margin:0 0 14px;"></div>
                <div class="sch-img-box" id="schBox" hidden><img id="schImg" alt="Orario di lavoro"></div>
                <p class="hint" id="schHint" style="margin-top:10px;" hidden>Tocca l'immagine per ingrandirla e scorrerla.</p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" hidden></div>

    <div class="sch-viewer" id="schViewer" hidden>
        <div class="sch-vbar">
            <button type="button" class="btn btn-tool" id="vZin">＋</button>

        <div class="sch-vscroll" id="vScroll"><img id="vImg" alt="Orario di lavoro"></div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzTrHvnRwyLfYlbGbIojfWAnvqa6EmO0ZYSZUY8ptaLOJBuRaBGdu8NvnKR3DJ3CHE5Vg/exec";

        // Chiamata verso Google Script: prima via JSONP (tag script), se non va via fetch (piano B)
        function jsonpOnce(params, timeoutMs) {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const s = document.createElement('script');
                const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeoutMs || 15000);
                function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
                window[cb] = d => { cleanup(); resolve(d); };
                s.onerror = () => { cleanup(); reject(new Error('bloccata')); };

                const res = await fetch(SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + q.toString(),
                    { method: 'GET', credentials: 'omit', redirect: 'follow', signal: ctrl ? ctrl.signal : undefined });

            try { return await fetchOnce(params, t); } catch (b) { e2 = b; }

        /* ---------- PDF (senza librerie): una pagina A4 orizzontale con l'immagine ---------- */
        function makePdfFromCanvas(cv) {
            const jpg = atob(cv.toDataURL('image/jpeg', 0.95).split(',')[1]);
            const jb = new Uint8Array(jpg.length); for (let i = 0; i < jpg.length; i++) jb[i] = jpg.charCodeAt(i);
            const pw = 842, ph = 595, m = 24, sc = Math.min((pw - 2 * m) / cv.width, (ph - 2 * m) / cv.height);
            const w = cv.width * sc, h = cv.height * sc, x = (pw - w) / 2, y = (ph - h) / 2;
            const enc = new TextEncoder(), parts = [], offs = []; let len = 0;
            const add = u => { parts.push(u); len += u.length; };
            const addS = s => add(enc.encode(s));
            const obj = (n, body) => { offs[n] = len; addS(n + ' 0 obj\n' + body + '\nendobj\n'); };
            addS('%PDF-1.4\n');
            obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
            obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
            obj(3, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + pw + ' ' + ph + '] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');
            offs[4] = len;
            addS('4 0 obj\n<< /Type /XObject /Subtype /Image /Width ' + cv.width + ' /Height ' + cv.height + ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + jb.length + ' >>\nstream\n');
            add(jb); addS('\nendstream\nendobj\n');
            const cs = 'q ' + w.toFixed(2) + ' 0 0 ' + h.toFixed(2) + ' ' + x.toFixed(2) + ' ' + y.toFixed(2) + ' cm /Im0 Do Q';
            obj(5, '<< /Length ' + cs.length + ' >>\nstream\n' + cs + '\nendstream');
            const xr = len;
            let t = 'xref\n0 6\n0000000000 65535 f \n';
            for (let i = 1; i <= 5; i++) t += String(offs[i]).padStart(10, '0') + ' 00000 n \n';
            addS(t + 'trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n' + xr + '\n%%EOF');
            return new Blob(parts, { type: 'application/pdf' });
        }

                    <div class="form-row">
                        <div class="form-group"><label class="start-lbl">Giorno</label><input type="date" name="startDate" value="${esc(r.startDate)}"></div>
                        <div class="form-group end-group"><label>Ultimo giorno</label><input type="date" name="endDate" value="${esc(r.endDate)}"></div>
                    </div>
                    <div class="form-group slot-group"><label>Quale mezza giornata?</label><div class="seg">${rad('Mattina')}${rad('Pomeriggio')}</div></div>
                    <div class="form-group"><label>Note <span class="opt">(facoltative)</span></label><textarea name="notes" rows="2" maxlength="300">${esc(r.notes)}</textarea></div>
                    <div class="req-actions">
                        <button type="submit" class="btn btn-success">Salva modifiche</button>
                        <button type="button" class="btn btn-del" data-act="close-edit">Chiudi</button>
                    </div>
                    <div class="msg" role="status"></div>
                </form>`;
                syncReqForm(slot.querySelector('form'));
            }
            if (b.dataset.act === 'close-edit') { card.querySelector('.edit-slot').innerHTML = ''; }
        });

        $('mineList').addEventListener('change', e => { if (e.target.name === 'type') syncReqForm(e.target.closest('form')); });
        $('mineList').addEventListener('submit', async function (e) {
            e.preventDefault();
            const f = e.target;
            const msgEl = f.querySelector('.msg');
            const bad = checkReqForm(f);
            if (bad) { setMsg(msgEl, 'err', bad); return; }
            const fd = new FormData(f);
            const btn = f.querySelector('button[type=submit]');
            btn.disabled = true; setMsg(msgEl, 'info', 'Salvataggio...');
            try {
                const d = await jsonp({ action: 'edit', name: session.name, pin: session.pin, id: f.dataset.id,
                    type: fd.get('type'), startDate: fd.get('startDate'), endDate: fd.get('endDate'), notes: fd.get('notes') || '', slot: fd.get('slot') || '' }, 20000);
                if (d && d.ok) { toast('Richiesta modificata.'); loadMine(true); return; }
                setMsg(msgEl, 'err', d && d.error === "gia' gestita" ? 'La richiesta è già stata gestita: non si può più modificare.' : 'Modifica non riuscita: ' + ((d && d.error) || 'errore'));
            } catch (err) { setMsg(msgEl, 'err', 'Connessione al server assente. Riprova.'); }
            btn.disabled = false;
        });

        /* ---------- Nuova richiesta ---------- */
        const form = $('requestForm');
        const btn = $('submitBtn');
        const msg = $('msg');
        form.action = SCRIPT_URL;
        function showMsg(kind, text) { setMsg(msg, kind, text); }
        $('reqType').addEventListener('change', () => { syncReqForm(form); showMsg('', ''); });
        form.addEventListener('reset', () => setTimeout(() => syncReqForm(form), 0));
        syncReqForm(form);
        $('notes').addEventListener('input', () => { $('notesCount').textContent = $('notes').value.length; });

        form.addEventListener('submit', function (e) {
            if (!session) { e.preventDefault(); showMsg('err', 'Sessione scaduta: accedi di nuovo.'); return; }
            const bad = checkReqForm(form);
            if (bad) { e.preventDefault(); showMsg('err', bad); return; }
            // L'invio vero e proprio lo fa il form (POST nell'iframe nascosto).
            const id = Date.now() + '' + Math.floor(Math.random() * 900 + 100);
            $('reqId').value = id;
            $('reqName').value = session.name;
            $('reqPin').value = session.pin;
            btn.disabled = true;
            btn.textContent = 'Invio in corso...';
            showMsg('info', 'Invio della richiesta in corso...');
            confirmSaved(id);
        });

        // Conferma reale: chiede al server se la richiesta è stata registrata
        async function confirmSaved(id) {
            const startedAt = Date.now();
            await new Promise(r => setTimeout(r, 1500));
            while (Date.now() - startedAt < 40000) {
                try {
                    const d = await jsonp({ action: 'check', id: id }, 10000);
                    if (d && d.exists) {
                        showMsg('', '');
                        form.reset(); $('notesCount').textContent = '0';
                        btn.disabled = false; btn.textContent = 'Invia Richiesta';
                        showTab('mine');
                        setMsg($('mineMsg'), 'ok', 'Richiesta inviata con successo! L\'amministratore è stato avvisato via email.');
                        setTimeout(() => setMsg($('mineMsg'), '', ''), 8000);
                        loadMine(false);
                        return;
                    }
                } catch (err) { /* riprova */ }
                await new Promise(r => setTimeout(r, 2000));
            }
            showMsg('err', 'Non ho ricevuto conferma dal server. Se il problema continua esci e rientra con il tuo PIN, oppure avvisa l\'amministratore.');
            btn.disabled = false;
            btn.textContent = 'Invia Richiesta';
        }

        /* ---------- Avvio ---------- */
        (async function init() {
            const ok = await loadEmployees();
            const saved = savedCred();
            if (ok && saved && saved.name && saved.pin) {
                $('loginName').value = saved.name;
                await doLogin(saved.name, saved.pin, !!lsGet('hr_cred'), true);
            }
        })();
    </script>


    <div id="installBar" class="install-bar" hidden>
        <div class="install-text" id="installText">Installa l'app sul tuo dispositivo per aprirla con un tocco</div>
        <button class="btn" id="installBtn" type="button">Installa</button>
        <button class="install-close" id="installClose" type="button" aria-label="Chiudi">&#10005;</button>
    </div>

    <script>
    (function () {
        // Service worker: rende l'app installabile e più veloce
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }

        var bar = document.getElementById('installBar');
        var txt = document.getElementById('installText');
        var btn = document.getElementById('installBtn');
        var closeBtn = document.getElementById('installClose');
        var deferred = null;
        var KEY = 'hr_install_dismissed';

        function isStandalone() {
            return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
        }
        function wasDismissed() {
            try {
                var t = parseInt(localStorage.getItem(KEY) || '0', 10);
                return t && (Date.now() - t) < 7 * 24 * 3600 * 1000;
            } catch (e) { return false; }
        }
        function showBar() {
            if (isStandalone() || wasDismissed()) return;
            bar.hidden = false;
            document.body.classList.add('has-install');
        }
        function hideBar() {
            bar.hidden = true;
            document.body.classList.remove('has-install');
        }

        closeBtn.addEventListener('click', function () {
            hideBar();
            try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
        });

        // Android / computer (Chrome, Edge): avviso automatico di installazione
        window.addEventListener('beforeinstallprompt', function (e) {
            e.preventDefault();
            deferred = e;
            showBar();
        });
        btn.addEventListener('click', async function () {
            if (!deferred) return;
            deferred.prompt();
            try { await deferred.userChoice; } catch (e) {}
            deferred = null;
            hideBar();
        });
        window.addEventListener('appinstalled', hideBar);

        // iPhone / iPad (Safari non ha l'installazione automatica: mostriamo le istruzioni)
        var ios = /iphone|ipad|ipod/i.test(navigator.userAgent) ||
                  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (ios && !isStandalone()) {
            txt.innerHTML = 'Per installare l\'app tocca <b>Condividi</b> e poi <b>Aggiungi alla schermata Home</b>';
            btn.style.display = 'none';
            showBar();
        }
    })();
    </script>
