<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management - Portale Dipendenti</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/gotham-rounded');

        :root {
            --unieuro-blue-dark: #002b66;
            --unieuro-blue: #0047bb;
            --unieuro-orange: #ff6600;
            --unieuro-orange-hover: #e55c00;
            --bg-light: #f4f6f9;
            --card-bg: #ffffff;
            --text: #111111;
            --border: #dddddd;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham Rounded Bold', 'Gotham Rounded', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002b66 0%, #0047bb 50%, #ff6600 100%);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--unieuro-blue-dark);
            padding: 22px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-bottom: 5px solid var(--unieuro-orange);
            width: 100%;
        }

        header .title-card {
            background-color: var(--unieuro-orange);
            padding: 12px 28px;
            border-radius: 14px;
            border: 2px solid #000000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-align: center;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-top: 5px solid var(--unieuro-orange);
        }

        .card h2 {
            margin-bottom: 20px;
            color: var(--unieuro-blue-dark);
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
            font-weight: 900;
            font-size: 1.3rem;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 800;
            color: #222;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            transition: border-color 0.2s;
            background-color: #fff;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--unieuro-orange);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            background-color: var(--unieuro-orange);
            color: #ffffff;
            border: 2px solid #000;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 900;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: var(--unieuro-orange-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .form-row { flex-direction: column; gap: 0; }
            .container { margin: 20px auto; padding: 0 12px; }
            .card { padding: 20px; }
            header h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="title-card">
            <h1>HR Management Portal</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Nuova Richiesta Ferie / Permesso</h2>
            <!-- Usiamo un iframe nascosto per evitare cambi di pagina e problemi di CORS -->
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { alertSuccess(); }"></iframe>
            
            <form id="requestForm" action="INCOLLA_QUI_IL_TUO_URL_GOOGLE_SCRIPT" method="POST" target="hidden_iframe" onsubmit="prepareSubmit(event)">
                <input type="hidden" name="id" id="reqId">
                <input type="hidden" name="status" value="In attesa">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="empName">Nome e Cognome Dipendente</label>
                        <select name="name" id="empName" required>
                            <option value="" disabled selected>Seleziona il tuo nome...</option>
                            <option value="MORABITO GIUSEPPE">MORABITO GIUSEPPE</option>
                            <option value="CAPONE DANIELE">CAPONE DANIELE</option>
                            <option value="D'AGOSTINO DOMENICO">D'AGOSTINO DOMENICO</option>
                            <option value="KEITA OUSMANE">KEITA OUSMANE</option>
                            <option value="RODI GIORGIO">RODI GIORGIO</option>
                            <option value="VIOLA PAOLO">VIOLA PAOLO</option>
                            <option value="ROSATO DOMENICO">ROSATO DOMENICO</option>
                            <option value="PLUTINO ANTONINO">PLUTINO ANTONINO</option>
                            <option value="ZUMBO VITALIANO">ZUMBO VITALIANO</option>
                            <option value="OPANASENKO POLINA">OPANASENKO POLINA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reqType">Tipologia</label>
                        <select name="type" id="reqType" required>
                            <option value="Ferie">Ferie</option>
                            <option value="Permesso">Permesso Orario</option>
                            <option value="Malattia">Malattia</option>
                            <option value="Giorno Libero">Giorno Libero</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Data Inizio</label>
                        <input type="date" name="startDate" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">Data Fine</label>
                        <input type="date" name="endDate" id="endDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Note / Motivazione (opzionale)</label>
                    <textarea name="notes" id="notes" rows="3" placeholder="Aggiungi eventuali dettagli..."></textarea>
                </div>
                <button type="submit" class="btn" id="submitBtn">Invia Richiesta</button>
            </form>
        </div>
    </div>

    <script>
        // Sostituisci l'action del form e questa costante con il tuo URL esatto di Google Apps Script
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwhgncx3fltDoF2OqN9hJDvTnqChXTQ7qpP7t4xgiq-A1Ie7uFPWf_d_wfmqchJEU-_6g/exec";
        document.getElementById('requestForm').action = SCRIPT_URL;

        let submitted = false;

        function prepareSubmit(e) {
            document.getElementById('reqId').value = Date.now();
            submitted = true;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Invio in corso...";
        }

        function alertSuccess() {
            if (submitted) {
                alert('Richiesta inviata con successo! L\'amministratore è stato avvisato via email.');
                document.getElementById('requestForm').reset();
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = "Invia Richiesta";
                submitted = false;
            }
        }
    </script>
</body>
</html>
