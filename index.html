<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management - Portale Dipendenti</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/gotham-rounded');

        :root {
            --unieuro-blue-dark: #002b66;
            --unieuro-blue: #0047bb;
            --unieuro-orange: #ff6600;
            --unieuro-orange-hover: #e55c00;
            --bg-light: #f4f6f9;
            --card-bg: #ffffff;
            --text: #111111;
            --border: #dddddd;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gotham Rounded Bold', 'Gotham Rounded', 'Segoe UI', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #002b66 0%, #0047bb 50%, #ff6600 100%);
            background-attachment: fixed;
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--unieuro-blue-dark);
            padding: 18px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-bottom: 5px solid var(--unieuro-orange);
        }

        header .title-card {
            background-color: var(--unieuro-orange);
            padding: 12px 24px;
            border-radius: 14px;
            border: 2px solid #000000;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 30px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
            border-top: 5px solid var(--unieuro-orange);
        }

        .card h2 {
            margin-bottom: 20px;
            color: var(--unieuro-blue-dark);
            border-bottom: 2px solid var(--bg-light);
            padding-bottom: 10px;
            font-weight: 900;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 800;
            color: #222;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 700;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--unieuro-orange);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            background-color: var(--unieuro-orange);
            color: #ffffff;
            border: 2px solid #000;
            padding: 14px 24px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.05rem;
            font-weight: 900;
            width: 100%;
            transition: all 0.2s;
            box-shadow: 0 3px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: var(--unieuro-orange-hover);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <header>
        <div class="title-card">
            <h1>HR Management Portal</h1>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Nuova Richiesta Ferie / Permesso</h2>
            <form id="requestForm" onsubmit="submitRequest(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label for="empName">Nome e Cognome Dipendente</label>
                        <select id="empName" required>
                            <option value="" disabled selected>Seleziona il tuo nome...</option>
                            <option value="MORABITO GIUSEPPE">MORABITO GIUSEPPE</option>
                            <option value="CAPONE DANIELE">CAPONE DANIELE</option>
                            <option value="D'AGOSTINO DOMENICO">D'AGOSTINO DOMENICO</option>
                            <option value="KEITA OUSMANE">KEITA OUSMANE</option>
                            <option value="RODI GIORGIO">RODI GIORGIO</option>
                            <option value="VIOLA PAOLO">VIOLA PAOLO</option>
                            <option value="ROSATO DOMENICO">ROSATO DOMENICO</option>
                            <option value="PLUTINO ANTONINO">PLUTINO ANTONINO</option>
                            <option value="ZUMBO VITALIANO">ZUMBO VITALIANO</option>
                            <option value="OPANASENKO POLINA">OPANASENKO POLINA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="reqType">Tipologia</label>
                        <select id="reqType" required>
                            <option value="Ferie">Ferie</option>
                            <option value="Permesso">Permesso Orario</option>
                            <option value="Malattia">Malattia</option>
                            <option value="Giorno Libero">Giorno Libero</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="startDate">Data Inizio</label>
                        <input type="date" id="startDate" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">Data Fine</label>
                        <input type="date" id="endDate" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="notes">Note / Motivazione (opzionale)</label>
                    <textarea id="notes" rows="3" placeholder="Aggiungi eventuali dettagli..."></textarea>
                </div>
                <button type="submit" class="btn" id="submitBtn">Invia Richiesta</button>
            </form>
        </div>
    </div>

    <script>
        // INCOLLA QUI IL TUO URL DI GOOGLE APPS SCRIPT
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyPA0qujtDR88Kg3cQH1VwIura7X5ojYWQ7GDxIuYtJwreM1nPTYvFGY9FjreUu2rSUYQ/exec";

        let requests = JSON.parse(localStorage.getItem('hr_requests')) || [];

        function submitRequest(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = "Invio in corso...";

            const newRequest = {
                id: Date.now(),
                name: document.getElementById('empName').value,
                type: document.getElementById('reqType').value,
                startDate: document.getElementById('startDate').value,
                endDate: document.getElementById('endDate').value,
                notes: document.getElementById('notes').value.trim(),
                status: 'In attesa'
            };

            requests.push(newRequest);
            localStorage.setItem('hr_requests', JSON.stringify(requests));

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(newRequest)
            }).catch(error => console.error('Errore invio email:', error));

            setTimeout(() => {
                alert('Richiesta inviata con successo! L\'amministratore è stato avvisato via email.');
                document.getElementById('requestForm').reset();
                submitBtn.disabled = false;
                submitBtn.textContent = "Invia Richiesta";
            }, 1000);
        }
    </script>
</body>
</html>
