<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Management - Pannello Amministratore</title>
    <style>
        @import url('https://fonts.cdnfonts.com/css/gotham-rounded');

          :root {
              --unieuro-blue-dark: #002b66;
              --unieuro-blue: #0047bb;
              --unieuro-orange: #ff6600;
              --unieuro-orange-hover: #e55c00;
              --bg-light: #f4f6f9;
              --card-bg: #ffffff;
              --text: #111111;
              --border: #dddddd;
              --success: #28a745;
              --warning: #ffc107;
              --danger: #dc3545;
          }

          * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                font-family: 'Gotham Rounded Bold', 'Gotham Rounded', 'Segoe UI', Arial, sans-serif;
          }

          body {
              background: linear-gradient(135deg, #002b66 0%, #0047bb 50%, #ff6600 100%);
              background-attachment: fixed;
              color: var(--text);
              display: flex;
              flex-direction: column;
              min-height: 100vh;
          }

          header {
              background-color: var(--unieuro-blue-dark);
              padding: 22px 30px;
              display: grid;
              grid-template-columns: 1fr auto 1fr;
              align-items: center;
              box-shadow: 0 4px 15px rgba(0,0,0,0.4);
              border-bottom: 5px solid var(--unieuro-orange);
             width: 100%;
             gap: 15px;
         }

         header .header-left {}

         header .title-card {
             background-color: var(--unieuro-orange);
             padding: 12px 28px;
             border-radius: 14px;
             border: 2px solid #000000;
             box-shadow: 0 4px 10px rgba(0,0,0,0.3);
             text-align: center;
             justify-self: center;
         }

         header h1 {
             font-size: 1.5rem;
             font-weight: 900;
             color: #ffffff;
             letter-spacing: 0.5px;
             text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
         }

         .nav-home-container {
             justify-self: end;
         }

         .nav-home-btn {
             background-color: var(--unieuro-orange);
             border: 2px solid #000000;
             color: #ffffff;
             padding: 12px 22px;
             border-radius: 14px;
             cursor: pointer;
             font-weight: 900;
             text-decoration: none;
             font-size: 0.95rem;
             box-shadow: 0 4px 10px rgba(0,0,0,0.3);
             transition: all 0.2s ease-in-out;
             display: inline-block;
             text-align: center;
         }

         .nav-home-btn:hover {
             background-color: var(--unieuro-orange-hover);
             transform: translateY(-2px);
         }

         .container {
             max-width: 1100px;
             margin: 40px auto;
             padding: 0 20px;
             width: 100%;
             flex: 1;
         }

         .card {
             background: var(--card-bg);
             border-radius: 14px;
             padding: 30px;
             box-shadow: 0 6px 20px rgba(0,0,0,0.2);
             margin-bottom: 25px;
             border-top: 5px solid var(--unieuro-orange);
         }

         .card h2 {
             margin-bottom: 20px;
             color: var(--unieuro-blue-dark);
             border-bottom: 2px solid var(--bg-light);
             padding-bottom: 10px;
             font-weight: 900;
             font-size: 1.3rem;
         }

         .form-group {
             margin-bottom: 18px;
         }

         .form-group label {
             display: block;
             margin-bottom: 6px;
             font-weight: 800;
             color: #222;
             font-size: 0.95rem;
         }

         .form-group input, .form-group select {
             width: 100%;
             padding: 12px;
             border: 2px solid var(--border);
             border-radius: 8px;
             font-size: 1rem;
             font-weight: 700;
             background-color: #fff;
         }

         .btn {
             background-color: var(--unieuro-orange);
             color: #ffffff;
             border: 2px solid #000;
             padding: 12px 24px;
             border-radius: 12px;
             cursor: pointer;
             font-size: 1rem;
             font-weight: 900;
                box-shadow: 0 3px 6px rgba(0,0,0,0.2);
                transition: all 0.2s;
         }

         .btn:hover {
             background-color: var(--unieuro-orange-hover);
             transform: translateY(-1px);
         }

         .btn-success { background-color: var(--success); }
         .btn-success:hover { background-color: #218838; }

         .btn-danger { background-color: var(--danger); }
         .btn-danger:hover { background-color: #c82333; }

         .table-responsive {
             width: 100%;
             overflow-x: auto;
         }

         table {
             width: 100%;
             border-collapse: collapse;
             margin-top: 15px;
             min-width: 650px;
         }

         th, td {
             padding: 12px;
             text-align: left;
             border-bottom: 1px solid var(--border);
         }

         th {
                background-color: var(--bg-light);
                font-weight: 900;
                color: var(--unieuro-blue-dark);
                font-size: 0.95rem;
         }

         td {
                font-weight: 700;
                font-size: 0.95rem;
         }

         .badge {
             padding: 6px 12px;
             border-radius: 6px;
             font-size: 0.85rem;
             font-weight: 900;
             color: white;
             display: inline-block;
         }
         .badge-pending { background-color: var(--warning); color: #111; }
         .badge-approved { background-color: var(--success); }
         .badge-rejected { background-color: var(--danger); }

         .login-box {
             max-width: 420px;
             margin: 40px auto;
         }

         .filters {
             display: flex;
             gap: 15px;
             margin-bottom: 20px;
             flex-wrap: wrap;
         }

         .filters select {
             padding: 10px;
             border-radius: 8px;
             border: 2px solid var(--border);
             font-weight: 700;
             flex: 1;
             min-width: 200px;
             background-color: #fff;
         }

        @media (max-width: 768px) {
             header {
                 grid-template-columns: 1fr;
                 justify-items: center;
                 text-align: center;
                 padding: 18px;
             }
             header .header-left { display: none; }
             .nav-home-container { justify-self: center; width: 100%; }
             .nav-home-btn { width: 100%; }
             .container { margin: 20px auto; padding: 0 12px; }
             .card { padding: 20px; }
             .filters { flex-direction: column; gap: 10px; }
             .filters select { width: 100%; }
        }
    
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
        .msg { display: none; margin-top: 16px; padding: 14px 16px; border-radius: 10px; font-weight: 800; border: 2px solid; }
        .msg.ok  { display: block; background: #e8f7ec; color: #14692b; border-color: #28a745; }
        .msg.err { display: block; background: #fdeaec; color: #9b1c2a; border-color: #dc3545; }
        .msg.info{ display: block; background: #eaf1ff; color: #002b66; border-color: #0047bb; }
        .logo { display: block; height: 76px; width: 76px; object-fit: cover; background: #000; border-radius: 16px; border: 2px solid #000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        header { flex-wrap: wrap; gap: 18px; }
        header .header-left { justify-self: start; display: flex; align-items: center; }
        @media (max-width: 768px) {
            .logo { height: 64px; width: 64px; }
            header .header-left { display: flex !important; justify-content: center; justify-self: center; }
        }

        .container { max-width: 1400px; }
        .dash-grid { display: grid; grid-template-columns: 370px 1fr; gap: 25px; align-items: start; }
        .archive-col { display: flex; flex-direction: column; gap: 25px; }
        .archive-col .card { margin-bottom: 0; padding: 22px; }
        .archive-ok { border-top-color: var(--success) !important; }
        .archive-ko { border-top-color: var(--danger) !important; }
        .count { background: var(--bg-light); border-radius: 12px; padding: 2px 10px; font-size: 0.85rem; margin-left: 8px; color: #333; }
        .archive-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
        .archive-item { border: 2px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; }
        .archive-item .a-name { font-weight: 900; color: var(--unieuro-blue-dark); }
        .archive-item .a-meta { margin-top: 2px; color: #444; font-size: 0.85rem; }
        .archive-item .a-note { margin-top: 4px; color: #555; font-size: 0.85rem; font-style: italic; }
        .archive-item .a-foot { margin-top: 8px; display: flex; justify-content: flex-end; }
        .btn-del { background-color: #6c757d; }
        .btn-del:hover { background-color: #565e64; }
        .empty { text-align: center; color: #666; padding: 8px; font-weight: 700; }
        @media (max-width: 1000px) { .dash-grid { grid-template-columns: 1fr; } .main-col { order: -1; } }
        .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 12px; }
        .toolbar .selall { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 0.85rem; cursor: pointer; margin: 0; }
        .toolbar input[type=checkbox], .archive-item input[type=checkbox], .col-sel input[type=checkbox] { width: 18px; height: 18px; padding: 0; margin: 0; flex: none; cursor: pointer; accent-color: #0047bb; }
        .toolbar .btn { width: auto; padding: 6px 12px; font-size: 0.8rem; }
        .btn-tool { background-color: #0047bb; }
        .btn-tool:hover { background-color: #002b66; }
        .archive-item { display: flex; gap: 10px; align-items: flex-start; }
        .archive-item .a-check { padding-top: 2px; display: flex; margin: 0; cursor: pointer; }
        .archive-item .a-body { flex: 1; min-width: 0; }
        .col-sel { width: 36px; }
        .print-only { display: none; }
        @media print {
            body.printing { background: #fff !important; display: block; min-height: 0; }
            body.printing header, body.printing .main-col:not(.print-target), body.printing #admin-login,
            body.printing .no-print, body.printing .col-sel, body.printing .col-act, body.printing .print-hide,
            body.printing .toolbar, body.printing .archive-item .a-check, body.printing .archive-item .a-foot,
            body.printing .archive-col .card:not(.print-target) { display: none !important; }
            body.printing .container { max-width: none; margin: 0; padding: 0; }
            body.printing .dash-grid { display: block; }
            body.printing .archive-col .card { box-shadow: none; border: none; padding: 0; }
            body.printing .archive-list { max-height: none !important; overflow: visible !important; }
            body.printing .main-col .card { box-shadow: none; border: none; padding: 0; }
            body.printing .table-responsive { overflow: visible; }
            body.printing table { width: 100%; border-collapse: collapse; }
            body.printing th, body.printing td { border-bottom: 1px solid #999; padding: 6px 8px; text-align: left; background: #fff !important; }
            body.printing tr { break-inside: avoid; }
            body.printing .archive-item { break-inside: avoid; border: 0; border-bottom: 1px solid #999; border-radius: 0; padding: 8px 0; }
            body.printing .print-only { display: block !important; margin: 4px 0 14px; color: #333; font-size: 0.9rem; }
        }
    </style>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwgXwgBmCrcX7JtpKvjdP8RRXxKScZCkK0F1br9fpLW_lpfrLQnxiTzbnpr9vL66UEhCQ/exec";

        // Chiamata verso Google Script via JSONP (nessun problema di CORS)
        function jsonp(params, timeoutMs) {
            return new Promise((resolve, reject) => {
                const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
                const s = document.createElement('script');
                const timer = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeoutMs || 15000);
                function cleanup() { clearTimeout(timer); delete window[cb]; s.remove(); }
                window[cb] = d => { cleanup(); resolve(d); };
                s.onerror = () => { cleanup(); reject(new Error('rete')); };
                const q = new URLSearchParams(Object.assign({}, params, { callback: cb }));
                s.src = SCRIPT_URL + (SCRIPT_URL.includes('?') ? '&' : '?') + q.toString();
                document.head.appendChild(s);
            });
        }
        function esc(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        let adminPassword = '';   // resta solo in memoria: la verifica avviene sul server
        let requests = [];

        function setLoginMsg(kind, text) {
            const m = document.getElementById('loginMsg');
            m.className = text ? 'msg ' + kind : 'msg';
            m.textContent = text || '';
        }

        async function loginAdmin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const pass = document.getElementById('adminPass').value;
            btn.disabled = true; btn.textContent = 'Verifica in corso...';
            setLoginMsg('', '');
            try {
                const d = await jsonp({ action: 'list', password: pass }, 20000);
                if (d && d.ok) {
                    adminPassword = pass;
                    requests = d.requests || [];
                    document.getElementById('admin-login').style.display = 'none';
                    document.getElementById('admin-dashboard').style.display = 'block';
                    displayTable();
                } else if (d && d.error === 'password') {
                    setLoginMsg('err', 'Password errata.');
                } else {
                    setLoginMsg('err', 'Errore del server: ' + ((d && d.error) || 'sconosciuto'));
                }
            } catch (err) {
                setLoginMsg('err', 'Impossibile contattare Google Script. Controlla che l\'URL sia corretto e che la distribuzione sia impostata su "Chiunque".');
            }
            btn.disabled = false; btn.textContent = 'Accedi';
        }

        function logoutAdmin() {
            adminPassword = ''; requests = [];
            document.getElementById('admin-login').style.display = 'block';
            document.getElementById('admin-dashboard').style.display = 'none';
            document.getElementById('adminPass').value = '';
            setLoginMsg('', '');
        }

        async function loadRequests() {
            const tbody = document.getElementById('adminTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Caricamento dati dal cloud...</td></tr>';
            try {
                const d = await jsonp({ action: 'list', password: adminPassword }, 20000);
                if (d && d.ok) { requests = d.requests || []; displayTable(); }
                else { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Errore: ' + esc(d && d.error) + '</td></tr>'; }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">Impossibile connettersi al server.</td></tr>';
            }
        }

        function fmtDate(s) {
            const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || '');
            return m ? m[3] + '/' + m[2] + '/' + m[1] : esc(s);
        }

        function getBadgeClass(status) {
            if (status === 'Approvato') return 'badge-approved';
            if (status === 'Rifiutato') return 'badge-rejected';
            return 'badge-pending';
        }

        let selected = new Set();                       // id selezionati (pannello + archivi)
        let currentVisible = { pending: [], approved: [], rejected: [] };
        const ARCH = {
            pending:  { bar: 'toolbarPending', list: 'adminTableBody', target: 'mainPanel',    sub: 'printSubPending',  rows: 'tr' },
            approved: { bar: 'cardApproved',   list: 'archiveApproved', target: 'cardApproved', sub: 'printSubApproved', rows: '.archive-item' },
            rejected: { bar: 'cardRejected',   list: 'archiveRejected', target: 'cardRejected', sub: 'printSubRejected', rows: '.archive-item' }
        };

        function sortById(list) {
            return list.sort((a, b) => String(b.id).localeCompare(String(a.id), undefined, { numeric: true }));
        }

        function archiveItem(r) {
            const id = String(r.id);
            return `
                <div class="archive-item">
                    <label class="a-check"><input type="checkbox" data-sel="${esc(id)}" ${selected.has(id) ? 'checked' : ''}></label>
                    <div class="a-body">
                        <div class="a-name">${esc(r.name)}</div>
                        <div class="a-meta">${esc(r.type)} &middot; ${fmtDate(r.startDate)} al ${fmtDate(r.endDate)}</div>
                        ${r.notes ? `<div class="a-note">${esc(r.notes)}</div>` : ''}
                        <div class="a-foot">
                            <button class="btn btn-del" style="width:auto; padding:5px 12px; font-size:0.8rem;" data-del="${esc(id)}">Cancella</button>
                        </div>
                    </div>
                </div>`;
        }

        function updateToolbar(key) {
            const ids = currentVisible[key];
            const bar = document.getElementById(ARCH[key].bar);
            const n = ids.filter(id => selected.has(id)).length;
            const all = bar.querySelector('[data-selall]');
            all.checked = ids.length > 0 && n === ids.length;
            all.indeterminate = n > 0 && n < ids.length;
            all.disabled = ids.length === 0;
            const del = bar.querySelector('[data-delmany]');
            if (del) { del.disabled = n === 0; del.textContent = 'Cancella selezionate (' + n + ')'; }
            const pr = bar.querySelector('[data-print]');
            pr.disabled = n === 0;
            pr.textContent = 'Stampa selezionate (' + n + ')';
        }
        function updateAllToolbars() { ['pending', 'approved', 'rejected'].forEach(updateToolbar); }

        function displayTable() {
            const empFilter = document.getElementById('filterEmployee').value;
            const all = requests.filter(r => empFilter === 'ALL' || r.name === empFilter);

            const pending  = sortById(all.filter(r => r.status === 'In attesa'));
            const approved = sortById(all.filter(r => r.status === 'Approvato'));
            const rejected = sortById(all.filter(r => r.status === 'Rifiutato'));

            currentVisible = {
                pending: pending.map(r => String(r.id)),
                approved: approved.map(r => String(r.id)),
                rejected: rejected.map(r => String(r.id))
            };
            const visible = new Set(currentVisible.pending.concat(currentVisible.approved, currentVisible.rejected));
            selected = new Set([...selected].filter(id => visible.has(id)));   // niente selezioni "nascoste" dal filtro

            // Pannello di controllo (richieste in attesa)
            const tbody = document.getElementById('adminTableBody');
            if (pending.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;">Nessuna richiesta in attesa.</td></tr>';
            } else {
                tbody.innerHTML = '';
                pending.forEach(req => {
                    const id = String(req.id);
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="col-sel"><input type="checkbox" data-sel="${esc(id)}" ${selected.has(id) ? 'checked' : ''}></td>
                        <td><strong>${esc(req.name)}</strong></td>
                        <td>${esc(req.type)}</td>
                        <td>${fmtDate(req.startDate)} al ${fmtDate(req.endDate)}</td>
                        <td>${esc(req.notes) || '-'}</td>
                        <td><span class="badge ${getBadgeClass(req.status)}">${esc(req.status)}</span></td>
                        <td class="col-act">
                            <div style="display:flex; gap:8px; flex-wrap:wrap;">
                                <button class="btn btn-success" style="width:auto; padding:6px 12px; font-size:0.85rem;" data-id="${esc(id)}" data-status="Approvato">Approva</button>
                                <button class="btn btn-danger" style="width:auto; padding:6px 12px; font-size:0.85rem;" data-id="${esc(id)}" data-status="Rifiutato">Rifiuta</button>
                                <button class="btn btn-del" style="width:auto; padding:6px 12px; font-size:0.85rem;" data-del="${esc(id)}">Cancella</button>
                            </div>
                        </td>`;
                    tbody.appendChild(tr);
                });
            }

            // Archivi a sinistra: approvate sopra, rifiutate sotto
            document.getElementById('countApproved').textContent = approved.length;
            document.getElementById('countRejected').textContent = rejected.length;
            document.getElementById('archiveApproved').innerHTML =
                approved.length ? approved.map(archiveItem).join('') : '<div class="empty">Nessuna richiesta approvata</div>';
            document.getElementById('archiveRejected').innerHTML =
                rejected.length ? rejected.map(archiveItem).join('') : '<div class="empty">Nessuna richiesta rifiutata</div>';
            updateAllToolbars();
        }

        // Cancellazione di più richieste insieme (archivi)
        async function deleteMany(key) {
            const ids = currentVisible[key].filter(id => selected.has(id));
            if (!ids.length) return;
            if (!confirm('Vuoi cancellare definitivamente ' + ids.length + (ids.length === 1 ? ' richiesta selezionata?' : ' richieste selezionate?') + '\n\nL\'operazione non si può annullare.')) return;

            const btn = document.getElementById(ARCH[key].bar).querySelector('[data-delmany]');
            btn.disabled = true; btn.textContent = 'Cancellazione...';
            const deleted = [];
            for (let i = 0; i < ids.length; i += 40) {
                const chunk = ids.slice(i, i + 40);
                try {
                    const d = await jsonp({ action: 'deleteMany', ids: chunk.join(','), password: adminPassword }, 30000);
                    if (d && d.ok) { chunk.forEach(id => deleted.push(id)); }
                    else { alert('Cancellazione non riuscita: ' + ((d && d.error) || 'errore sconosciuto')); break; }
                } catch (err) {
                    alert('Cancellazione non riuscita: connessione al server assente.');
                    break;
                }
            }
            requests = requests.filter(r => !deleted.includes(String(r.id)));
            deleted.forEach(id => selected.delete(id));
            displayTable();
        }

        // Stampa / salvataggio PDF: solo le richieste selezionate
        function clearPrintMarks() {
            document.body.classList.remove('printing');
            document.querySelectorAll('.print-hide').forEach(el => el.classList.remove('print-hide'));
            document.querySelectorAll('.print-target').forEach(el => el.classList.remove('print-target'));
        }

        function printSelection(key) {
            const info = ARCH[key];
            const chosen = currentVisible[key].filter(id => selected.has(id));
            if (!chosen.length) return;
            clearPrintMarks();

            // nasconde in stampa le righe NON spuntate
            document.getElementById(info.list).querySelectorAll(info.rows).forEach(row => {
                const cb = row.querySelector('[data-sel]');
                if (!cb || !cb.checked) row.classList.add('print-hide');
            });

            const emp = document.getElementById('filterEmployee').value;
            const now = new Date();
            const when = now.toLocaleDateString('it-IT') + ' ' + now.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
            document.getElementById(info.sub).textContent =
                'Stampato il ' + when + (emp !== 'ALL' ? ' - Dipendente: ' + emp : '') + ' - Richieste selezionate: ' + chosen.length;

            document.getElementById(info.target).classList.add('print-target');
            document.body.classList.add('printing');
            window.addEventListener('afterprint', clearPrintMarks, { once: true });
            window.print();
        }

        const dash = document.getElementById('admin-dashboard');

        // Spunte (singole e "Seleziona tutto")
        dash.addEventListener('change', function (e) {
            const t = e.target;
            if (t.dataset.sel !== undefined) {
                if (t.checked) selected.add(t.dataset.sel); else selected.delete(t.dataset.sel);
                updateAllToolbars();
            } else if (t.dataset.selall) {
                const key = t.dataset.selall;
                currentVisible[key].forEach(id => { if (t.checked) selected.add(id); else selected.delete(id); });
                document.getElementById(ARCH[key].list).querySelectorAll('[data-sel]').forEach(cb => { cb.checked = t.checked; });
                updateAllToolbars();
            }
        });

        dash.addEventListener('click', async function (e) {
            const pb = e.target.closest('button[data-print]');
            if (pb) { printSelection(pb.dataset.print); return; }
            const mb = e.target.closest('button[data-delmany]');
            if (mb) { deleteMany(mb.dataset.delmany); return; }

            const b = e.target.closest('button[data-id], button[data-del]');
            if (!b) return;

            // Cancellazione singola
            if (b.dataset.del) {
                const id = b.dataset.del;
                const r = requests.find(x => String(x.id) === String(id));
                const label = r ? r.name + ' (' + fmtDate(r.startDate) + ' - ' + fmtDate(r.endDate) + ')' : 'questa richiesta';
                if (!confirm('Vuoi cancellare definitivamente la richiesta di ' + label + '?')) return;
                b.disabled = true;
                try {
                    const d = await jsonp({ action: 'delete', id: id, password: adminPassword }, 20000);
                    if (d && d.ok) {
                        requests = requests.filter(x => String(x.id) !== String(id));
                    } else {
                        alert('Cancellazione non riuscita: ' + ((d && d.error) || 'errore sconosciuto'));
                    }
                } catch (err) {
                    alert('Cancellazione non riuscita: connessione al server assente.');
                }
                displayTable();
                return;
            }

            // Approva / Rifiuta
            const id = b.dataset.id, status = b.dataset.status;
            b.parentElement.querySelectorAll('button').forEach(x => x.disabled = true);
            try {
                const d = await jsonp({ action: 'update', id: id, status: status, password: adminPassword }, 20000);
                if (d && d.ok) {
                    const r = requests.find(x => String(x.id) === String(id));
                    if (r) r.status = status;
                    selected.delete(String(id));   // la richiesta passa in archivio: parte deselezionata
                } else {
                    alert('Aggiornamento non riuscito: ' + ((d && d.error) || 'errore sconosciuto'));
                }
            } catch (err) {
                alert('Aggiornamento non riuscito: connessione al server assente.');
            }
            displayTable();
        });
    </script>
</body>
</html>
